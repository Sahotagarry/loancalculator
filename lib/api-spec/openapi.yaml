        successorInitialAmount: { type: number, minimum: 0 }
      required: [predecessorLeaseType, originalLeaseTerminated, replacementLeaseExecuted, terminationEvidenceReference, entryDate, debitAccount, creditAccount, amount, entryEvidenceReference, predecessorDeferredRentAsset, predecessorDeferredRentLiability, predecessorAssetCost, predecessorAccumulatedDepreciation, successorInitialAmount]

