  schemas:
    AuthMe:
      type: object
      required: [tenantId, objectId, firmId, role]
      properties:
        tenantId: { type: string }
        objectId: { type: string }
        firmId: { type: string }
        displayName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { type: string, enum: [admin, manager, accountant, read_only] }
    AppUser:
      type: object
      required: [objectId, role, isActive]
      properties:
        tenantId: { type: string }
        objectId: { type: string }
        firmId: { type: string }
        displayName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { type: string, enum: [admin, manager, accountant, read_only] }
        isActive: { type: boolean }
    AppUserInput:
      type: object
      required: [objectId, role]
      properties:
        objectId: { type: string, format: uuid }
        displayName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { type: string, enum: [admin, manager, accountant, read_only] }
        isActive: { type: boolean }
    AppUserUpdate:
      type: object
      properties:
        displayName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { type: string, enum: [admin, manager, accountant, read_only] }
        isActive: { type: boolean }
    ClientMembersInput:
      type: object
      required: [memberObjectIds]
      properties:
        memberObjectIds: { type: array, items: { type: string } }
    FvDecisionConfirmationInput:
      type: object
      required: [expectedVersion, treatment, confirmedBy]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        treatment:
          type: string
          enum: [use_fv, trivial, immaterial]
        marketEffectiveRate:
          type: [number, "null"]
        rationaleNote:
          type: [string, "null"]
        confirmedBy:
          type: string
          minLength: 1

    FvDecisionConfirmation:
      type: object
      required:
        - id
        - loanId
        - version
        - treatment
        - confirmedAt
        - confirmedBy
        - canonicalFingerprint
        - contractFingerprint
        - reportingContextFingerprint
        - evidenceVersion
        - calculationVersion
        - evidence
      properties:
        id: { type: string }
        loanId: { type: string }
        sourceConfirmationId: { type: [string, "null"], description: Immutable confirmation from which this historical evidence was inherited. }
        inheritedFromLoanId: { type: [string, "null"], description: Source loan that owned the inherited evidence. }
        sourceFileId: { type: [string, "null"], description: Source reporting file for the inherited evidence. }
        version: { type: integer }
        treatment:
          type: string
          enum: [use_fv, trivial, immaterial]
        marketEffectiveRate: { type: [string, "null"] }
        rationaleNote: { type: [string, "null"] }
        confirmedAt: { type: string, format: date-time }
        confirmedBy: { type: string }
        canonicalFingerprint: { type: string }
        contractFingerprint: { type: string }
        eventSetFingerprint: { type: [string, "null"] }
        reportingContextFingerprint: { type: string }
        modificationFingerprint: { type: [string, "null"] }
        evidenceVersion: { type: string }
        calculationVersion: { type: string }
        evidence:
          type: object
          additionalProperties: true

    FvDecisionHistory:
      type: object
      required: [status, reviewRequired, staleReasons, missingRequirements, history]
      properties:
        status:
          type: string
          enum: [current, stale, incomplete]
        reviewRequired: { type: boolean }
        staleReasons:
          type: array
          items:
            type: string
            enum:
              - contract_terms_changed
              - event_or_rate_history_changed
              - reporting_context_changed
              - modification_assessment_changed
              - compatibility_projection_mismatch
              - inherited_historical_evidence
        missingRequirements:
          type: array
          items: { type: string }
        current:
          oneOf:
            - $ref: "#/components/schemas/FvDecisionConfirmation"
            - type: "null"
        history:
          type: array
          items: { $ref: "#/components/schemas/FvDecisionConfirmation" }

