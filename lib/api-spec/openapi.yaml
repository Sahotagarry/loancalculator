          type: string
          nullable: true
          description: Explicitly links this agreement to a prior agreement. Send null with the other modification fields null to remove a link.
        modificationEffectiveDate:
          type: string
          format: date
          nullable: true
        modificationAssessment:
          allOf:
            - $ref: "#/components/schemas/AgreementModificationAssessment"
          nullable: true
        changeReason:
          type: string
          description: Audit reason recorded when schedule-driving terms change.

    AgreementModificationAssessment:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [confirmed]
        assessmentDate:
          type: string
          format: date
        confirmedAt:
          type: string
          format: date-time
        confirmedBy:
          type: string
          minLength: 1
        evidence:
          $ref: "#/components/schemas/AgreementModificationEvidence"
        conclusion:
          $ref: "#/components/schemas/AgreementModificationConclusion"
      required: [status, assessmentDate, confirmedAt, confirmedBy, evidence, conclusion]

    AgreementModificationEvidence:
      type: object
      additionalProperties: false
      properties:
        changeSummary:
          type: string
          minLength: 1
        contractualChanges:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AgreementContractualChange"
        qualitativeFactors:
          type: array
          items:
            type: string
            minLength: 1
        facts:
          $ref: "#/components/schemas/AgreementModificationFacts"
        quantitativeTest:
          allOf:
            - $ref: "#/components/schemas/AgreementQuantitativeTest"
          nullable: true
      required: [changeSummary, contractualChanges, qualitativeFactors, facts]

    AgreementModificationFacts:
      type: object
      additionalProperties: false
      properties:
        creditorChanged: { type: boolean }
        creditorChangedEvidence: { type: string }
        legalDischarge: { type: boolean }
        legalDischargeEvidence: { type: string }
        relatedParty: { type: boolean }
        relatedPartyEvidence: { type: string }
      required: [creditorChanged, legalDischarge, relatedParty]

    AgreementContractualChange:
      type: object
      additionalProperties: false
      properties:
        term: { type: string, minLength: 1 }
        predecessorValue: { type: string, minLength: 1 }
        successorValue: { type: string, minLength: 1 }
        significance: { type: string, minLength: 1 }
        sourceReference: { type: string, minLength: 1 }
      required: [term, predecessorValue, successorValue, significance, sourceReference]

    AgreementQuantitativeTest:
      type: object
      additionalProperties: false
      properties:
        method: { type: string, minLength: 1 }
        originalEffectiveRate: { type: number }
        carryingAmount: { type: number }
        originalRemainingCashFlows:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AgreementCashFlow" }
        modifiedCashFlows:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AgreementCashFlow" }
        sameDayPaymentTreatment:
          type: string
          enum: [include, exclude]
        creditorFees: { type: number }
        otherTransactionCosts: { type: number }
        accruedInterest: { type: number }
        accruedInterestTreatment:
          type: string
          enum: [included_in_carrying_amount, include_in_cash_flows, add_to_carrying_amount, exclude]
        predecessorAmount: { type: number }
        successorAmount: { type: number }
        presentValueOfOriginalRemainingCashFlows:
          type: number
          description: "Canonical server-computed denominator: present value of remaining original cash flows at the original effective rate."
        presentValueOfModifiedCashFlows:
          type: number
          description: "Canonical server-computed present value of modified cash flows, including applicable creditor fees and accrued interest treatment."
        differenceAmount: { type: number }
        differencePercent: { type: number }
        retainedFeesAndCosts:
          type: number
          minimum: 0
          description: Separately evidenced prior unamortized fees and costs; never includes current transaction costs.
        retainedFeesAndCostsSourceReference:
          type: string
          minLength: 1
        newFeesAndCosts:
          type: number
          minimum: 0
          description: Resulting-basis input equal to creditorFees plus otherTransactionCosts.
        settlementConsideration:
          type: number
          minimum: 0
          description: Explicit settlement consideration. Required and greater than zero when the accountant concludes extinguishment; never inferred from present value.
        recommendation:
          type: string
          enum: [derecognize_original, account_as_modification]
      required: [method, originalEffectiveRate, carryingAmount, originalRemainingCashFlows, modifiedCashFlows, sameDayPaymentTreatment, creditorFees, otherTransactionCosts, accruedInterest, accruedInterestTreatment, presentValueOfOriginalRemainingCashFlows, presentValueOfModifiedCashFlows, differenceAmount, differencePercent, retainedFeesAndCosts, retainedFeesAndCostsSourceReference, newFeesAndCosts, recommendation]

    AgreementCashFlow:
      type: object
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        amount: { type: number }
        description: { type: string, minLength: 1 }
        sourceReference: { type: string, minLength: 1 }
      required: [date, amount, description, sourceReference]

    AgreementModificationConclusion:
      type: object
      additionalProperties: false
      properties:
