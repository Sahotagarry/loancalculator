openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - entraAuth: []
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: files
    description: File (fiscal year) management
  - name: loans
    description: Loan and lease management
  - name: master-agreements
    description: Master financing agreements grouping facilities
  - name: trash
    description: Trash (soft-deleted items)
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClient"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClient"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      responses:
        "204":
          description: Deleted
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /clients/{id}/files:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listFiles
      tags: [files]
      summary: List files for a client
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/File"
    post:
      operationId: createFile
      tags: [files]
      summary: Create a file for a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFile"
      responses:
        "201":
          description: Created file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getFile
      tags: [files]
      summary: Get a file
      responses:
        "200":
          description: File
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateFile
      tags: [files]
      summary: Update a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFile"
      responses:
        "200":
          description: Updated file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file
      responses:
        "204":
          description: Deleted
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/{id}/rollforward:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rollForwardFile
      tags: [files]
      summary: Roll forward all outstanding loans to next fiscal year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollForwardFileRequest"
      responses:
        "201":
          description: Rolled forward file with created loans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollForwardFileResult"
        "200":
          description: Existing idempotent roll-forward result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollForwardFileResult"
        "400":
          description: Invalid roll-forward setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Source contractual evidence is unresolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/{id}/loans:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listLoans
      tags: [loans]
      summary: List loans for a file
      responses:
        "200":
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
    post:
      operationId: createLoan
      tags: [loans]
      summary: Create a loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoan"
      responses:
        "201":
          description: Created loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files/{id}/master-agreements:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listMasterAgreements
      tags: [master-agreements]
      summary: List master agreements for a file
      responses:
        "200":
          description: List of master agreements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterAgreement"
    post:
      operationId: createMasterAgreement
      tags: [master-agreements]
      summary: Create a master agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterAgreement"
      responses:
        "201":
          description: Created master agreement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterAgreement"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /master-agreements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMasterAgreement
      tags: [master-agreements]
      summary: Get a master agreement
      responses:
        "200":
          description: Master agreement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterAgreement"
        "404":
          description: Master agreement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMasterAgreement
      tags: [master-agreements]
      summary: Update a master agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMasterAgreement"
      responses:
        "200":
          description: Updated master agreement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterAgreement"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Master agreement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMasterAgreement
      tags: [master-agreements]
      summary: Delete a master agreement (facilities become standalone loans)
      responses:
        "204":
          description: Deleted
        "404":
          description: Master agreement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /master-agreements/{id}/source-document:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMasterAgreementSourceDocument
      tags: [master-agreements]
      summary: Download the master agreement's attached source document
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: No source document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /counterparties:
    get:
      operationId: listCounterparties
      tags: [loans]
      summary: List distinct counterparties used across all loans
      responses:
        "200":
          description: List of counterparty names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /loans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLoan
      tags: [loans]
      summary: Get a loan
      responses:
        "200":
          description: Loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "404":
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateLoan
      tags: [loans]
      summary: Update a loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoan"
      responses:
        "200":
          description: Updated loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteLoan
      tags: [loans]
      summary: Delete a loan
      responses:
        "204":
          description: Deleted
        "404":
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /loans/{id}/event-sets:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listLoanEventSets
      tags: [loans]
      summary: Get the active event set and immutable history
      responses:
        "200":
          description: Active event set and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEventSetHistory"
        "404":
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createLoanEventSet
      tags: [loans]
      summary: Append and activate a complete successor event set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanEventSet"
      responses:
        "201":
          description: Created event set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEventSet"
        "400":
          description: Invalid event timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version conflict or agreement-change workflow required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /loans/{id}/fv-decisions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFvDecisionHistory
      tags: [loans]
      summary: Get the current persisted FV decision, derived review status, and immutable history
      responses:
        "200":
          description: FV review status and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FvDecisionHistory"
        "404":
          description: Loan not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: confirmFvDecision
      tags: [loans]
      summary: Append and persist an explicit FV decision confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FvDecisionConfirmationInput"
      responses:
        "201":
          description: Immutable confirmation appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FvDecisionConfirmation" }
        "400":
          description: Required decision evidence is invalid or incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Optimistic concurrency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /loans/{id}/event-sets/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: previewLoanEventSet
      tags: [loans]
      summary: Validate and fingerprint a proposed complete event set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanEventSet"
      responses:
        "200":
          description: Structural preview and evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEventSetPreview"
        "400":
          description: Invalid event timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version conflict or agreement-change workflow required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /prime-rate:
    get:
      operationId: getPrimeRate
      tags: [loans]
      summary: Get suggested fair value rate
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Prime rate and suggested FV rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimeRateResponse"
        "500":
          description: Failed to fetch rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /loans/{id}/rate-timeline:
    get:
      operationId: getLoanRateTimeline
      tags: [loans]
      summary: Get immutable contractual rate timeline and findings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rate terms, event-set history, and reconciliation findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateTimeline"

  /loans/{id}/rate-overrides:
    post:
      operationId: overrideLoanRate
      tags: [loans]
      summary: Override the contractual benchmark rate from an effective date
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateOverrideInput"
      responses:
        "201":
          description: Immutable override event-set created
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /loans/{id}/rate-restores:
    post:
      operationId: restoreLoanSourcedRate
      tags: [loans]
      summary: Restore sourced benchmark evidence without erasing override history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateRestoreInput"
      responses:
        "201":
          description: Immutable restoration event-set created
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /rate-resets/refresh:
    post:
      security: []
      operationId: refreshDueRateResets
      tags: [loans]
      summary: Authenticated server-only due-reset refresh
      parameters:
        - name: x-rate-refresh-secret
          in: header
          required: true
          schema: { type: string, writeOnly: true }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateRefreshInput"
      responses:
        "200":
          description: Refresh run evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateRefreshRun" }
        "401":
          description: Scheduler authentication failed closed

  /rate-resets/status:
    get:
      operationId: getRateResetStatus
      tags: [loans]
      summary: Get refresh run and unresolved reconciliation status
      responses:
        "200":
          description: Recent runs and unresolved findings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /loans/{id}/rollforward:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rollForwardLoan
      tags: [loans]
      summary: Roll forward a loan to next fiscal year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollForwardRequest"
      responses:
        "201":
          description: Rolled forward loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "404":
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings/azure:
    get:
      operationId: getAzureSettings
      tags: [settings]
      summary: Get Azure integration settings status (secrets masked)
      responses:
        "200":
          description: Azure settings status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AzureSettingsStatus"
    put:
      operationId: updateAzureSettings
      tags: [settings]
      summary: Save Azure integration settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AzureSettingsInput"
      responses:
        "200":
          description: Updated settings status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AzureSettingsStatus"

  /files/{id}/import-document:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: importDocument
      tags: [loans]
      summary: Upload a PDF and extract loan/lease data from it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUpload"
      responses:
        "200":
          description: Extraction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportResult"
        "400":
          description: Missing settings or invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Document could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /trash:
    get:
      operationId: listTrash
      tags: [trash]
      summary: List all trashed clients, year-end files, and loans/leases
      responses:
        "200":
          description: Trash contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashContents"

  /trash/{type}/{id}/restore:
    parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [client, file, loan]
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: restoreTrashItem
      tags: [trash]
      summary: Restore a trashed item (and any trashed parents needed to reach it)
      responses:
        "204":
          description: Restored
        "404":
          description: Item not found in trash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /trash/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [client, file, loan]
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: purgeTrashItem
      tags: [trash]
      summary: Permanently delete a trashed item (cannot be undone)
      responses:
        "204":
          description: Permanently deleted
        "404":
          description: Item not found in trash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      responses:
        "200": { description: Current authenticated identity, content: { application/json: { schema: { $ref: "#/components/schemas/AuthMe" } } } }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      responses:
        "200": { description: Tenant users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AppUser" } } } } }
    post:
      operationId: createAdminUser
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppUserInput" } } } }
      responses: { "201": { description: User registered, content: { application/json: { schema: { $ref: "#/components/schemas/AppUser" } } } } }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppUserUpdate" } } } }
      responses: { "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/AppUser" } } } } }
  /admin/legacy-clients:
    get:
      operationId: listLegacyClients
      tags: [admin]
      responses:
        "200":
          description: Quarantined legacy clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
  /admin/legacy-clients/{id}/adopt:
    post:
      operationId: adoptLegacyClient
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClientMembersInput" } } } }
      responses: { "200": { description: Adopted client, content: { application/json: { schema: { $ref: "#/components/schemas/Client" } } } } }
  /admin/clients/{id}/members:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getClientMembers
      tags: [admin]
      responses:
        "200":
          description: Client members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppUser" }
    put:
      operationId: replaceClientMembers
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClientMembersInput" } } } }
      responses: { "204": { description: Replaced } }

components:
  securitySchemes:
